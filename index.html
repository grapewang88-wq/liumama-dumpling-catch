<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>刘妈妈 · 接海鲜包饺子</title>
<style>
/* ============================================================
   C1 售货机营销小游戏 —— 刘妈妈「接海鲜·包饺子」
   设计基准 1080 x 1920 竖屏 / 32寸电容触摸屏 / 纯触摸
   20 秒限时：按左右键挪动饺子皮，接住天上掉的食材，凑齐配方就包成一只饺子
   本作不接出货，只出分数 + 本机排行榜（localStorage）
   背景/按钮/九宫格/音效复用「闻馅识饺子」，食材与饺子皮是本作专属素材
   ============================================================ */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;background:#08182B;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans CN",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none;
}
#viewport{position:fixed;inset:0;overflow:hidden;background:#08182B}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden}
img,.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.abs{position:absolute}
.center-x{left:50%;transform:translateX(-50%)}

.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.screen.fade-in{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* 暗角：把视线收到中间，顺便让浅色背景不至于糊成一片 */
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(125% 78% at 50% 44%, rgba(0,0,0,0) 52%, rgba(78,35,23,.30) 100%)}

#s-attract{background:url("assets/bg-attract.png") center/1080px 1920px no-repeat,linear-gradient(180deg,#CFE6FF,#9FCFF2)}
/* 背景右上角那块招牌很抢眼，压一层夜色下去，标题才立得住 */
#s-attract::before{content:"";position:absolute;left:0;top:0;width:1080px;height:640px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg, rgba(16,24,54,.64) 0%, rgba(16,24,54,.40) 52%, rgba(16,24,54,0) 100%)}
#s-game,#s-result,#s-board{background:url("assets/bg-game.png") center/1080px 1920px no-repeat,linear-gradient(180deg,#CFE6FF,#9FCFF2)}
/* 顶部一层暖色压光：食材从这层里掉出来，HUD 也不会跟背景的招牌打架 */
#s-game::before{content:"";position:absolute;left:0;top:0;width:1080px;height:520px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg, rgba(224,240,255,.92) 0%, rgba(210,232,252,.70) 58%, rgba(200,228,250,0) 100%)}

/* ---------- 九宫格 / 文字框 / 按钮：与前两作完全一致 ---------- */
.c9{border:30px solid transparent;border-image:url("assets/card-9slice.png") 60 fill stretch;
    image-rendering:pixelated;color:#0F3D66;
    filter:drop-shadow(0 10px 0 rgba(78,35,23,.20)) drop-shadow(0 2px 0 rgba(78,35,23,.14))}
.btn{
  width:560px;height:168px;border:none;padding:0;background:transparent;
  background-image:url("assets/btn-primary.png");
  background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;
  font-size:52px;font-weight:900;letter-spacing:4px;color:#0E3E68;
  text-shadow:0 2px 0 rgba(255,255,255,.55), 0 0 10px rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .07s ease;
}
.btn:active{background-image:url("assets/btn-primary-press.png");transform:translateY(8px)}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.btn2{
  width:420px;height:132px;border:none;padding:0;background:transparent;
  background-image:url("assets/btn-ghost.png");
  background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;
  font-size:44px;font-weight:900;letter-spacing:4px;color:#EAF4FF;
  text-shadow:0 3px 0 #0B3A63;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.btn2:active{background-image:url("assets/btn-ghost-press.png")}
.btn2.sm{width:280px;height:88px;font-size:32px}   /* 840x264 的 1/3，等比缩放不变形 */
/* 绝对定位的按钮用显式 left 居中：动画会覆盖 transform，不能靠 translateX(-50%) */
#btn-start{left:289px;width:502px;height:156px}
#btn-board{left:380px;width:319px;height:94px;font-size:38px}

/* ============================================================
   待机页
   竖向节奏：品牌行 → 标题 → 副标题绶带 → 三步 → 计分 → 最高分 → 按钮
   字号只用四档：52 强调 / 32 正文 / 26 标签 / 数字另算，别再加新的
   ============================================================ */
#brand{top:186px;left:40px;width:1000px;text-align:center;
  font-size:32px;font-weight:800;letter-spacing:14px;text-indent:14px;color:#F3DCA8;
  text-shadow:0 3px 0 rgba(50,24,10,.65), 0 0 18px rgba(30,14,4,.4)}
#title-art{top:150px;left:492px;width:560px;height:344px;
  background:url("assets/title-catch-v.png") right top/contain no-repeat;image-rendering:pixelated;
  animation:titlebob 3.4s ease-in-out infinite}
@keyframes titlebob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* 副标题做成绶带，比一行裸字有分量 */
#title-sub{top:492px;left:270px;width:540px;height:84px;border-radius:42px;
  background:linear-gradient(180deg,#3FA0E8,#1E6FBF);border:5px solid #FFE9B8;
  box-shadow:0 8px 0 rgba(60,26,10,.45);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:900;letter-spacing:8px;text-indent:8px;color:#FFFFFF;
  text-shadow:0 3px 0 rgba(90,20,10,.7)}

.how{position:absolute;top:620px;left:60px;width:960px;display:flex;gap:24px}
.how .step{flex:1;height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-size:32px;font-weight:800;line-height:1.38;text-align:center;position:relative}
.how .step .n{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(180deg,#4EA8EC,#1E6FBF);border:5px solid #EAF4FF;
  box-shadow:0 5px 0 rgba(78,35,23,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:900;color:#FFFFFF;text-shadow:0 2px 0 rgba(90,20,10,.6)}
.how .step img{width:112px;height:112px;margin-top:26px;
  filter:drop-shadow(0 5px 0 rgba(78,35,23,.18))}
.how .step img.dp{width:150px;height:120px}          /* 饺子素材是 600x480，别拉圆了 */
.how .step .pair{display:flex;align-items:center;gap:8px;margin-top:26px}
.how .step .pair img{width:92px;height:92px;margin-top:0}

/* 计分规则条 */
#rules{top:968px;left:60px;width:960px;height:172px;display:flex;align-items:center}
#rules .r{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border-right:3px dashed rgba(60,110,160,.28);height:120px}
#rules .r:last-child{border-right:none}
#rules .r img{width:74px;height:74px;image-rendering:pixelated;
  filter:drop-shadow(0 4px 0 rgba(78,35,23,.16))}
#rules .r img.dp{width:92px;height:74px}
#rules .r .x{width:74px;height:74px;display:flex;align-items:center;justify-content:center;
  font-size:56px;font-weight:900;color:#C0392B}
#rules .r .k{font-size:25px;font-weight:800;color:#4E86B8;letter-spacing:2px}
#rules .r .v{font-size:34px;font-weight:900;line-height:1}
#rules .v.plus{color:#1E7A3C}
#rules .v.minus{color:#C0392B}
#rules .r.hi .v{color:#D9880E}
#rules .r.hi img{animation:coinshine 1.8s ease-in-out infinite}
@keyframes coinshine{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.14) rotate(-8deg)}}

/* 本机最高分：做成一块小牌子 */
#best-line{top:1195px;left:281px;width:518px;height:122px;border-radius:0;
  background:url("assets/plank-best.png") center/100% 100% no-repeat;border:none;box-shadow:none;
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:41px;font-weight:900;letter-spacing:2px;color:#FFF7E6;
  text-shadow:0 3px 0 rgba(60,30,8,.75);white-space:nowrap;overflow:visible}
#best-line .crown{width:70px;height:70px;image-rendering:pixelated;
  filter:drop-shadow(0 3px 0 rgba(60,30,8,.5));margin-top:-4px}
#best-line b{font-size:65px;color:#FFFFFF;font-variant-numeric:tabular-nums;letter-spacing:0;
  text-shadow:0 3px 0 rgba(60,30,8,.8)}
#best-line span{opacity:.96}

/* ============================================================
   游戏页 HUD
   ============================================================ */
.hud{position:absolute;top:36px;height:132px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.05}
.hud .k{font-size:25px;font-weight:800;color:#4E86B8;letter-spacing:8px;text-indent:8px}
.hud .v{font-size:60px;font-weight:900;color:#0F3D66;font-variant-numeric:tabular-nums;
  text-shadow:0 3px 0 rgba(255,247,220,.9)}
#hud-score{left:40px;width:300px}
#hud-time{left:390px;width:300px}
#hud-combo{left:740px;width:300px}
#hud-time .v.warn{color:#C0392B;animation:tick .5s steps(2) infinite}
@keyframes tick{50%{transform:scale(1.12)}}
#hud-combo.on .v{color:#C0392B}
#hud-combo .mul{position:absolute;right:-10px;top:-16px;min-width:104px;height:56px;padding:0 14px;
  border-radius:28px;background:linear-gradient(180deg,#4EA8EC,#1E6FBF);border:5px solid #EAF4FF;
  box-shadow:0 5px 0 rgba(78,35,23,.35);
  display:none;align-items:center;justify-content:center;
  font-size:30px;font-weight:900;color:#FFFFFF;text-shadow:0 2px 0 rgba(90,20,10,.6)}
#hud-combo.on .mul{display:flex;animation:mulpop .3s ease}
@keyframes mulpop{0%{transform:scale(1.5)}100%{transform:scale(1)}}

#timebar-bg{top:182px;left:40px;width:1000px;height:26px;z-index:5;
  background:rgba(96,52,26,.30);border:5px solid #235E8C;
  box-shadow:0 5px 0 rgba(78,35,23,.22), inset 0 3px 0 rgba(60,26,10,.22)}
#timebar{position:absolute;left:0;top:0;height:100%;width:100%;
  background:linear-gradient(180deg,#A7DC72 0%,#6EBB48 46%,#4E9C36 100%);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.14);transition:background .3s}
/* 刻度：每 10% 一道，纯 CSS，不用素材 */
#timebar-bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg, rgba(78,35,23,.28) 0 3px, transparent 3px 100px)}
#timebar.warn{background:linear-gradient(180deg,#F0975A 0%,#DC5432 46%,#B93A1E 100%);
  animation:barpulse .5s steps(2) infinite}
@keyframes barpulse{50%{filter:brightness(1.25)}}

/* 目标卡 */
#target-card{top:222px;left:40px;width:1000px;height:206px;display:flex;align-items:center}
#target-left{width:474px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;
  border-right:4px dashed rgba(60,110,160,.30)}
#target-label{font-size:24px;font-weight:800;letter-spacing:6px;color:#4E86B8}
#target-art{width:440px;height:110px;
  background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;
  transition:opacity .18s}
#target-needs{flex:1;display:flex;flex-direction:column;gap:16px;padding-left:30px}
.need{display:flex;align-items:center;gap:16px;transition:opacity .2s}
.need img{width:84px;height:84px;
  filter:drop-shadow(0 4px 0 rgba(78,35,23,.18))}
.need .nm{font-size:33px;font-weight:900;color:#0F3D66;width:92px;letter-spacing:1px}
.need .dots{display:flex;gap:11px}
/* 进度点用 CSS 画，比原来那两张浅灰 png 清楚得多 */
.need .dots i{width:34px;height:34px;border-radius:50%;
  background:#D9EAFB;border:5px solid #6BA3D6;box-shadow:inset 0 3px 0 rgba(120,80,36,.20)}
.need .dots i.on{background:radial-gradient(circle at 35% 32%, #FFF0B4 0%, #FFC93C 42%, #E09612 100%);
  border-color:#8A5A22;box-shadow:inset 0 -3px 0 rgba(120,70,10,.28);animation:dotpop .28s ease}
@keyframes dotpop{0%{transform:scale(2.1)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.need .tick{font-size:36px;font-weight:900;color:#1E7A3C;opacity:0;transition:opacity .2s}
.need.done{opacity:.62}
.need.done .tick{opacity:1}

/* 掉落层 / 饺子皮：压在 HUD 下面，食材从顶栏背后掉出来 */
#playfield{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;z-index:1}
.hud,#timebar-bg,#target-card{z-index:5}
#made,#countdown,.mvbtn{z-index:8}
.item{position:absolute;left:0;top:0;width:160px;height:160px;background-size:100% 100%;
  background-repeat:no-repeat;image-rendering:pixelated;will-change:transform}
.item.gold{filter:drop-shadow(0 0 18px rgba(255,206,74,.95))}

#skin-shadow{position:absolute;top:1608px;width:320px;height:60px;
  background:url("assets/skin-shadow.png") center/100% 100% no-repeat;opacity:.75;will-change:transform}
#skin{position:absolute;top:1480px;width:320px;height:160px;
  background:url("assets/skin.png") center/100% 100% no-repeat;image-rendering:pixelated;will-change:transform}
#skin.hit{animation:skinhit .22s ease}
#skin.bad{animation:skinbad .3s ease}
@keyframes skinhit{0%{transform:translate(var(--tx),0) scale(1,1)}40%{transform:translate(var(--tx),6px) scale(1.08,.9)}100%{transform:translate(var(--tx),0) scale(1,1)}}
@keyframes skinbad{0%,100%{filter:none}30%{filter:brightness(.6) saturate(.4)}}

/* 空中飘的细面粉：纯 CSS，十来个点，几乎不耗性能 */
#motes{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;z-index:0}
#motes i{position:absolute;width:10px;height:10px;border-radius:50%;
  background:rgba(255,252,236,.85);box-shadow:0 0 8px rgba(255,246,214,.9)}
@keyframes mote{
  0%  {transform:translate(0,0) scale(.7);opacity:0}
  15% {opacity:.85}
  85% {opacity:.7}
  100%{transform:translate(var(--mx),-620px) scale(1.1);opacity:0}
}

/* 接到食材时皮上扑起的面粉 */
.puff{position:absolute;width:150px;height:60px;pointer-events:none;
  background:radial-gradient(ellipse at 50% 60%, rgba(255,250,232,.95) 0%, rgba(250,238,206,.55) 45%, rgba(250,238,206,0) 72%);
  animation:puffout .42s ease-out forwards}
@keyframes puffout{
  0%  {transform:translate(-50%,-40%) scale(.4);opacity:.95}
  100%{transform:translate(-50%,-120%) scale(1.5);opacity:0}
}

/* 飘分 */
.float{position:absolute;font-size:52px;font-weight:900;pointer-events:none;color:#0F3D66;
  text-shadow:0 3px 0 rgba(255,247,220,.9);animation:floatup .8s ease-out forwards}
.float.plus{color:#1E7A3C}
.float.minus{color:#C0392B}
.float.big{font-size:72px;color:#D9642A}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.7);opacity:0}
  20%{transform:translate(-50%,-24px) scale(1.1);opacity:1}
  100%{transform:translate(-50%,-170px) scale(1);opacity:0}}

.spark{position:absolute;width:72px;height:72px;pointer-events:none;
  background:url("assets/items/fx-sparkle.png") center/100% 100% no-repeat;image-rendering:pixelated;
  animation:sparkfly .55s ease-out forwards}
@keyframes sparkfly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}
  100%{transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(1.1);opacity:0}}

/* 成饺子 */
#made{position:absolute;left:50%;top:1180px;width:400px;height:320px;margin-left:-200px;
  pointer-events:none;display:none}
#made.show{display:block;animation:madepop .9s ease-out forwards}
#made .glow{position:absolute;left:-150px;top:-190px;width:700px;height:700px;
  background:url("assets/dumpling-glow.png") center/100% 100% no-repeat;opacity:.9}
#made .dp{position:absolute;left:0;top:0;width:400px;height:320px;background-size:100% 100%;
  background-repeat:no-repeat;image-rendering:pixelated}
@keyframes madepop{0%{transform:scale(.4);opacity:0}
  25%{transform:scale(1.12);opacity:1}55%{transform:scale(1);opacity:1}
  100%{transform:scale(.7) translateY(-700px);opacity:0}}

/* 左右键：本作唯一的操作方式，所以做大做实，按下有明显反馈 */
.mvbtn{position:absolute;bottom:40px;width:300px;height:236px;border-radius:44px;
  background:linear-gradient(180deg,#4FB0F0 0%,#2E86DE 52%,#1E6FBF 100%);
  border:7px solid #EAF4FF;
  box-shadow:0 14px 0 #124C7E, 0 20px 0 rgba(15,45,80,.28),
             inset 0 7px 0 rgba(255,255,255,.20), inset 0 -10px 0 rgba(0,0,0,.20);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;transition:none}
.mvbtn .ar{width:92px;height:104px;background:#FFFFFF;
  filter:drop-shadow(0 6px 0 rgba(60,26,10,.45))}
.mvbtn .ar.l{clip-path:polygon(100% 0, 100% 100%, 0 50%)}
.mvbtn .ar.r{clip-path:polygon(0 0, 0 100%, 100% 50%)}
.mvbtn.down{transform:translateY(12px);
  background:linear-gradient(180deg,#2E86DE 0%,#1E6FBF 52%,#15568F 100%);
  box-shadow:0 2px 0 #124C7E, inset 0 6px 0 rgba(255,255,255,.18), inset 0 -8px 0 rgba(0,0,0,.22)}
.mvbtn.down .ar{filter:none;transform:scale(.94)}
.mvbtn.tip{animation:mvtip 1.1s ease-in-out infinite}
@keyframes mvtip{0%,100%{border-color:#EAF4FF}50%{border-color:#FFD24A}}
#mv-l{left:30px}
#mv-r{right:30px}

/* 开场倒数 */
#countdown{position:absolute;inset:0;background:rgba(10,40,70,.45);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:30px}
#countdown.show{display:flex}
#cd-num{font-size:340px;font-weight:900;color:#FFFFFF;
  text-shadow:0 0 0 #0B3A63,8px 8px 0 #0B3A63,-8px 8px 0 #0B3A63,8px -8px 0 #0B3A63,-8px -8px 0 #0B3A63,0 24px 40px rgba(0,0,0,.5);
  animation:cdpop .6s ease-out}
#cd-tip{font-size:46px;font-weight:900;color:#FFFFFF;text-shadow:0 4px 0 #0B3A63}
@keyframes cdpop{0%{transform:scale(2.2);opacity:0}40%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}

/* 开局提示：告诉玩家按下面两个键，几秒后自己淡出 */
#move-hint{position:absolute;left:348px;top:1690px;width:384px;height:140px;border-radius:30px;
  background:linear-gradient(180deg,rgba(46,134,222,.94),rgba(15,61,102,.94));
  border:5px solid #EAF4FF;box-shadow:0 8px 0 rgba(67,32,11,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;
  font-size:38px;font-weight:900;color:#FFFFFF;text-shadow:0 3px 0 rgba(60,26,10,.7);
  pointer-events:none;transition:opacity .4s;z-index:9}
#move-hint.gone{opacity:0}

/* ============================================================
   结算 / 排行榜
   ============================================================ */
/* 结算/榜单用的是白天那张背景，标题得用深色，不能照搬待机页的浅色 */
#res-title{top:126px;left:40px;width:1000px;text-align:center;font-size:58px;font-weight:900;color:#235E8C;
  letter-spacing:8px;text-indent:8px;
  text-shadow:0 4px 0 rgba(255,247,220,.95), 0 10px 16px rgba(90,42,18,.18)}

/* 名次绶带压在卡片上沿 */
#res-rank{top:196px;left:330px;width:420px;height:80px;border-radius:40px;z-index:3;
  background:linear-gradient(180deg,#E8A33C,#C97F16);border:5px solid #EAF4FF;
  box-shadow:0 7px 0 rgba(78,35,23,.38);
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:34px;font-weight:900;color:#FFF8E4;letter-spacing:2px;
  text-shadow:0 3px 0 rgba(122,60,10,.65)}
#res-rank.m1{background:linear-gradient(180deg,#F5C842,#D99A0C)}
#res-rank.m2{background:linear-gradient(180deg,#C3CBD4,#8E9BA6)}
#res-rank.m3{background:linear-gradient(180deg,#D9955C,#A9682F)}

#res-card{top:252px;left:60px;width:960px;height:560px}

<script>
"use strict";
/* ================================================================
 * 1. 配置
 *    改数值只动这一块。素材换图直接覆盖 assets/ 下同名文件。
 * ================================================================ */
const VERSION = "catch-1.0.0";

const CONFIG = {
  duration: 20,            // 单局秒数
  difficulty: 1.0,         // 0.7 慢 ~ 1.4 快，整体节奏系数
  sound: true,
  bgmVolume: 0.34,
  sfxVolume: 0.85,
  idleBackSec: 45,         // 结算/榜单页无操作多少秒回待机
  boardKeep: 300,          // 榜单最多保留多少条

  /* 分数 */
  score: {
    hit: 10,               // 接对一个食材
    comboStep: 0.15,       // 每级连击加成
    comboMax: 8,
    miss: -15,             // 接到不该接的
    dumpling: 100,         // 包成一只饺子的基础分（再乘馅料稀有度）
    coin: 60              // 硬币
  },

  /* 掉落节奏：随时间从 start 线性过渡到 end，再乘 difficulty */
  fall: {
    speedStart: 480, speedEnd: 760,     // px/s
    gapStart: 0.50,  gapEnd: 0.26,      // 秒/个
    maxOnScreen: 8,
    targetBias: 0.62,                   // 掉落物里属于当前配方的比例
    coinChance: 0.05,                  // 硬币出现概率
    graceSec: 0.8                       // 换配方后的免罚窗口，见下方说明
  },

  skin: { width: 320, height: 160, top: 1480, follow: 20, btnSpeed: 1500 },
  /* itemSize 跟素材尺寸保持一致（160），像素才能 1:1 对齐不糊。
     接取判定只看饺子皮的宽度，跟这个值无关，所以改它不影响难度 */
  field: { left: 60, right: 1020, itemSize: 160, spawnY: -190 }
};

/* 11 种食材 —— id 要和 assets/items/item-<id>.png 对上 */
const FOODS = {
  chive:    { name:"韭菜" },
  shrimp:   { name:"虾仁" },
  corn:     { name:"玉米" },
  pork:     { name:"鲜肉" },
  fennel:   { name:"茴香" },
  egg:      { name:"鸡蛋" },
  mackerel: { name:"鲅鱼" },
  octopus:  { name:"八蛸" },
  scallop:  { name:"干贝" },
  radish:   { name:"萝卜" },
  zhizha:   { name:"脂渣" }
};

/* 六种馅 —— id 与 assets/fillings/filling-<id>.png、assets/flavors/flavor-title-<id>.png 对应
   need: [食材id, 个数]，rare 是稀有度倍率（越难凑的馅分越高） */
const RECIPES = [
  { id:"chive-shrimp",     name:"韭菜双虾",     need:[["chive",2],["shrimp",1]],    rare:1.0 },
  { id:"corn-pork",        name:"马蹄玉米鲜肉", need:[["corn",2],["pork",1]],       rare:1.0 },
  { id:"fennel-egg",       name:"茴香鸡蛋",     need:[["fennel",2],["egg",1]],      rare:1.1 },
  { id:"radish-zhizha",    name:"萝卜丝脂渣",   need:[["radish",2],["zhizha",1]],   rare:1.2 },
  { id:"mackerel",         name:"胶东鲅鱼",     need:[["mackerel",2],["pork",1]],   rare:1.4 },
  { id:"octopus-scallop",  name:"八蛸干贝",     need:[["octopus",1],["scallop",2]], rare:1.6 }
];

const ASSETS = {
  base: "assets/",
  item:   id => `items/item-${id}.png`,
  filling: id => `fillings/filling-${id}.png`,
  flavor:  id => `flavors/flavor-title-${id}.png`,
  coin:  "items/item-coin.png",
  sfx: { tap:"sfx/sfx-tap.mp3",       swap:"sfx/sfx-swap.wav",
         correct:"sfx/sfx-correct.mp3", wrong:"sfx/sfx-wrong.wav",
         complete:"sfx/sfx-complete.mp3", drop:"sfx/sfx-drop.wav" }
};
const assetUrl = f => f ? (/^(https?:|data:|\/)/.test(f) ? f : ASSETS.base + f) : "";
const bgUrl = f => `url("${assetUrl(f)}")`;

/* ================================================================
 * 2. 本地存储：排行榜 + 统计 + 运维覆盖项
 *    纯前端不联网。以后要联网榜单，见《对接说明.md》最后一节。
 * ================================================================ */
const STORE_KEY = "c1_catch_v1";
const Store = {
  data: null,
  load(){
    let d = null;
    try { d = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch(e){}
    if (!d || d.ver !== 1) d = { ver:1, board:[], stats:{ plays:0, dumplings:0 }, over:{} };
    if (!Array.isArray(d.board)) d.board = [];
    d.stats = Object.assign({ plays:0, dumplings:0 }, d.stats);
    d.over = d.over || {};
    ["duration","difficulty","idleBackSec"].forEach(k=>{ if (typeof d.over[k]==="number") CONFIG[k]=d.over[k]; });
    ["bgmVolume","sfxVolume"].forEach(k=>{ if (typeof d.over[k]==="number") CONFIG[k]=d.over[k]; });
    if (typeof d.over.sound === "boolean") CONFIG.sound = d.over.sound;
    this.data = d; return d;
  },
  save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); }catch(e){} },
  setOver(k, v){ this.data.over[k] = v; CONFIG[k] = v; this.save(); },

  /* 榜单 */
  add(rec){
    this.data.board.push(rec);
    this.data.board.sort((a,b) => b.s - a.s || a.t - b.t);
    if (this.data.board.length > CONFIG.boardKeep) this.data.board.length = CONFIG.boardKeep;
    this.save();
  },
  list(scope){
    const all = this.data.board.slice().sort((a,b) => b.s - a.s || a.t - b.t);
    if (scope === "today") { const d = dayKey(Date.now()); return all.filter(r => dayKey(r.t) === d); }
    return all;
  },
  best(){ const l = this.list("all"); return l.length ? l[0] : null; },
  rankOf(rec, scope){
    const l = this.list(scope);
    const i = l.findIndex(r => r.t === rec.t && r.s === rec.s && r.n === rec.n);
    return i < 0 ? l.length + 1 : i + 1;
  }
};
const dayKey = ts => { const d = new Date(ts); return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); };
Store.load();

/* ================================================================
 * 3. 声音
 * ================================================================ */
const Sound = {
  bgm:null, started:false, pool:{},
  init(){
    if (!this.bgm) {
      this.bgm = document.getElementById("bgm");
      Object.keys(ASSETS.sfx).forEach(k => {
        const a = new Audio(assetUrl(ASSETS.sfx[k])); a.preload = "auto"; this.pool[k] = a;
      });
    }
    this.applyVolume();
    if (!this.started && CONFIG.sound) {
      const p = this.bgm.play(); if (p && p.catch) p.catch(()=>{});
      this.started = true;
    }
  },
  applyVolume(){
    if (this.bgm) {
      this.bgm.volume = Math.max(0, Math.min(1, CONFIG.bgmVolume));
      this.bgm.muted = !CONFIG.sound;
      if (CONFIG.sound && this.started && this.bgm.paused) {
        const p = this.bgm.play(); if (p && p.catch) p.catch(()=>{});
      }
    }
    Object.values(this.pool).forEach(a => {
      a.volume = Math.max(0, Math.min(1, CONFIG.sfxVolume));
      a.muted = !CONFIG.sound;
    });
  },
  play(name, interrupt){
    if (!CONFIG.sound) return;
    const a = this.pool[name]; if (!a) return;
    if (interrupt) { try { a.currentTime = 0; } catch(e){} }
    else if (!a.paused && a.currentTime > 0) return;
    const p = a.play(); if (p && p.catch) p.catch(()=>{});
  },
  tap(){ this.play("tap", true); },
  right(){ this.play("correct", true); },
  wrong(){ this.play("wrong", true); },
  win(){ this.play("complete", true); },
  gold(){ this.play("swap", true); },
  drop(){ this.play("drop", true); }
};

/* ================================================================
 * 4. DOM + 舞台缩放（1080x1920 等比铺满，两边留黑）
 * ================================================================ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const stage = $("#stage");

function fitStage(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / 1080, vh / 1920);
  stage.style.transform = `translate(${(vw - 1080 * s) / 2}px, ${(vh - 1920 * s) / 2}px) scale(${s})`;
  Stage.scale = s;
  Stage.offX = (vw - 1080 * s) / 2;
}
const Stage = { scale:1, offX:0 };
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", () => setTimeout(fitStage, 200));
fitStage();

["contextmenu","gesturestart","gesturechange","selectstart","dragstart"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });

const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const rnd = (a,b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function show(id){
  $$(".screen").forEach(s => s.classList.remove("active","fade-in"));
  const el = $("#" + id);
  el.classList.add("active","fade-in");
  /* 那 20 秒里顶栏要让给 HUD，别的页面静音按钮一直在 */
  $("#snd").style.display = (id === "s-game") ? "none" : "flex";
}

/* ================================================================
 * 5. 昵称
 * ================================================================ */
const NICK_A = ["快手","胶东","海边","面粉","蒜香","三鲜","元宝","擀面","热气","码头","早市","八大关"];
const NICK_B = ["小当家","包饺侠","一把手","状元","大王","高手","小能手","师傅"];
const randomNick = () => pick(NICK_A) + pick(NICK_B);

/* ================================================================
 * 6. 局内状态
 * ================================================================ */
const G = {
  running:false, t:0, left:0,
  score:0, combo:0, maxCombo:0, dumplings:0, made:[],   // made 记下这局包出的馅，结算页要摆出来
  caught:0, missed:0,               // 接对 / 接错，算准确率
  items:[], nextSpawn:0, seq:0,
  target:null, prog:null,           // 当前配方 + 进度 {foodId:已接数}
  grace:0,                          // 刚换配方的免罚倒计时（秒）
  skinX:540, skinTarget:540, moveDir:0,
  lastTs:0, raf:0, endAt:0
};

const el = {
  score:$("#v-score"), time:$("#v-time"), combo:$("#v-combo"), mul:$("#v-mul"),
  timebar:$("#timebar"), hudTime:$("#hud-time"), hudCombo:$("#hud-combo"),
  art:$("#target-art"), needs:$("#target-needs"),
  field:$("#playfield"), skin:$("#skin"), skinShadow:$("#skin-shadow"),
  made:$("#made"), madeDp:$("#made .dp"), hint:$("#move-hint")
};

/* ---------- 目标配方 ---------- */
function nextTarget(){
  let r;
  do { r = pick(RECIPES); } while (G.target && r.id === G.target.id && RECIPES.length > 1);
  G.target = r;
  G.prog = {};
  r.need.forEach(([f]) => G.prog[f] = 0);
  /* 刚换馅的一瞬间，天上还飘着上一个配方的食材，这时候接到不能算玩家的错 */
  G.grace = CONFIG.fall.graceSec;
  renderTarget();
}

function renderTarget(){
  const r = G.target;
  el.art.style.backgroundImage = bgUrl(ASSETS.flavor(r.id));
  el.needs.innerHTML = r.need.map(([f, n]) => {
    const got = G.prog[f] || 0;
    const dots = Array.from({length:n}, (_, i) => `<i class="${i < got ? "on" : ""}"></i>`).join("");
    return `<div class="need ${got >= n ? "done" : ""}" data-f="${f}">
      <img src="${assetUrl(ASSETS.item(f))}" alt="">
      <div class="nm">${FOODS[f].name}</div>
      <div class="dots">${dots}</div>
      <div class="tick">✓</div>
    </div>`;
  }).join("");
}

/* 当前还缺的食材 */
function missingFoods(){
  return G.target.need.filter(([f, n]) => (G.prog[f]||0) < n).map(([f]) => f);
}
function isNeeded(f){
  const item = G.target.need.find(x => x[0] === f);
  return !!item && (G.prog[f]||0) < item[1];
}
function recipeDone(){
  return G.target.need.every(([f, n]) => (G.prog[f]||0) >= n);
}

/* ---------- 掉落 ---------- */
function curveT(){ return clamp(G.t / Math.max(1, CONFIG.duration), 0, 1); }

function spawn(){
  const p = curveT(), F = CONFIG.fall;
  const gold = Math.random() < F.coinChance;
  let food;
  if (!gold) {
    const want = missingFoods();
    if (want.length && Math.random() < F.targetBias) food = pick(want);
    else {
      /* 干扰项：别的配方里的食材，且不是当前还缺的（否则等于白送） */
      const pool = Object.keys(FOODS).filter(f => !isNeeded(f));
      food = pool.length ? pick(pool) : pick(Object.keys(FOODS));
    }
  }
  const size = CONFIG.field.itemSize;
  const x = rnd(CONFIG.field.left, CONFIG.field.right - size);
  const speed = (F.speedStart + (F.speedEnd - F.speedStart) * p) * CONFIG.difficulty * rnd(0.94, 1.06);

  const node = document.createElement("div");
  node.className = "item" + (gold ? " gold" : "");
  node.style.backgroundImage = bgUrl(gold ? ASSETS.coin : ASSETS.item(food));
  node.style.transform = `translate3d(${x}px,${CONFIG.field.spawnY}px,0)`;
  el.field.appendChild(node);

  /* 左右轻轻摇，不做整圈旋转 —— 转起来食材就认不出了，老人小孩尤其吃亏 */
  G.items.push({ node, x, y:CONFIG.field.spawnY, vy:speed, food, gold,
                 swing:rnd(6, 13), phase:rnd(0, 6.28), rot:0, dead:false });
}

function removeItem(it){
  it.dead = true;
  if (it.node.parentNode) it.node.parentNode.removeChild(it.node);
}

/* ---------- 判定 ---------- */
const CATCH_LINE = () => CONFIG.skin.top + 50;      // 皮面的高度（贴图里皮面大约在 44px 处）
const ITEM_FOOT  = () => CONFIG.field.itemSize * 0.72;

function tryCatch(it, prevY){
  const line = CATCH_LINE();
  const footPrev = prevY + ITEM_FOOT(), foot = it.y + ITEM_FOOT();
  if (!(footPrev < line && foot >= line)) return false;
  const icx = it.x + CONFIG.field.itemSize / 2;
  const half = CONFIG.skin.width / 2 - 16;          // 两边各留一点，接边缘不算
  if (Math.abs(icx - G.skinX) > half) return false;
  onCatch(it);
  return true;
}

function onCatch(it){
  const S = CONFIG.score;
  if (it.gold){
    const add = S.coin;
    G.score += add; Sound.gold();
    floatText(`+${add}`, it.x + CONFIG.field.itemSize/2, CONFIG.skin.top - 30, "plus big");
    sparkles(it.x + CONFIG.field.itemSize/2, CONFIG.skin.top);
    puff(G.skinX, CONFIG.skin.top + 40);
    bumpSkin(false);
    removeItem(it); syncHud(); return;
  }

  if (isNeeded(it.food)){
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.caught++;
    const mul = 1 + S.comboStep * Math.min(G.combo, S.comboMax);
    const add = Math.round(S.hit * mul);
    G.score += add;
    G.prog[it.food] = (G.prog[it.food]||0) + 1;
    Sound.right();
    floatText(`+${add}`, it.x + CONFIG.field.itemSize/2, CONFIG.skin.top - 30, "plus");
    sparkles(it.x + CONFIG.field.itemSize/2, CONFIG.skin.top);
    puff(G.skinX, CONFIG.skin.top + 40);
    bumpSkin(false);
    removeItem(it);
    renderTarget();
    if (recipeDone()) completeDumpling();
  } else if (G.grace > 0){
    /* 免罚窗口内：上一个配方的余料，不扣分也不断连击 */
    Sound.drop();
    floatText("换馅啦", it.x + CONFIG.field.itemSize/2, CONFIG.skin.top - 30, "");
    removeItem(it);
  } else {
    G.combo = 0; G.missed++;
    const add = S.miss;
    G.score = Math.max(0, G.score + add);
    Sound.wrong();
    floatText(`${add}`, it.x + CONFIG.field.itemSize/2, CONFIG.skin.top - 30, "minus");
    bumpSkin(true);
    removeItem(it);
  }
  syncHud();
}

function completeDumpling(){
  const r = G.target;
  const add = Math.round(CONFIG.score.dumpling * r.rare);
  G.score += add; G.dumplings++; G.combo += 2;
  G.made.push(r.id);
  G.maxCombo = Math.max(G.maxCombo, G.combo);
  Sound.win();
  syncHud();

  el.madeDp.style.backgroundImage = bgUrl(ASSETS.filling(r.id));
  el.made.classList.remove("show"); void el.made.offsetWidth;
  el.made.classList.add("show");
  floatText(`${r.name} +${add}`, 540, 1120, "plus big");

  /* 场上属于旧配方的东西清掉一部分，避免刚换目标就被旧料砸中扣分。
     这里只标 dead，不动数组 —— 主循环跑完会统一过滤（这函数就是从主循环里调进来的）*/
  G.items.forEach(it => { if (!it.gold && !it.dead && it.y < 700) removeItem(it); });

  nextTarget();
}

/* ---------- 特效 ---------- */
/* 面粉点：进游戏页时铺一次，之后靠 CSS 自己飘 */
function buildMotes(){
  const box = $("#motes");
  if (box.children.length) return;
  let html = "";
  for (let i = 0; i < 14; i++){
    const x = Math.round(rnd(40, 1040)), y = Math.round(rnd(700, 1800));
    const dur = rnd(9, 17).toFixed(1), delay = (-rnd(0, 17)).toFixed(1);
    const mx = Math.round(rnd(-90, 90)), sc = rnd(.5, 1.3).toFixed(2);
    html += `<i style="left:${x}px;top:${y}px;--mx:${mx}px;transform:scale(${sc});
             animation:mote ${dur}s linear ${delay}s infinite"></i>`;
  }
  box.innerHTML = html;
}

function puff(x, y){
  const d = document.createElement("div");
  d.className = "puff";
  d.style.left = x + "px"; d.style.top = y + "px";
  el.field.appendChild(d);
  setTimeout(() => d.parentNode && d.parentNode.removeChild(d), 460);
}

function floatText(txt, x, y, cls){
  const d = document.createElement("div");
  d.className = "float " + (cls || "");
  d.textContent = txt;
  d.style.left = clamp(x, 120, 960) + "px";
  d.style.top = y + "px";
  el.field.appendChild(d);
  setTimeout(() => d.parentNode && d.parentNode.removeChild(d), 850);
}
function sparkles(x, y){
  for (let i = 0; i < 5; i++){
    const s = document.createElement("div");
    s.className = "spark";
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--sx", rnd(-110, 110).toFixed(0) + "px");
    s.style.setProperty("--sy", rnd(-130, -30).toFixed(0) + "px");
    el.field.appendChild(s);
    setTimeout(() => s.parentNode && s.parentNode.removeChild(s), 600);
  }
}
function bumpSkin(bad){
  el.skin.classList.remove("hit","bad"); void el.skin.offsetWidth;
  el.skin.classList.add(bad ? "bad" : "hit");
}

function syncHud(){
  el.score.textContent = G.score;
  el.combo.textContent = G.combo;
  const on = G.combo >= 3;
  el.hudCombo.classList.toggle("on", on);
  if (on){
    const mul = 1 + CONFIG.score.comboStep * Math.min(G.combo, CONFIG.score.comboMax);
    const txt = "×" + mul.toFixed(1);
    if (el.mul.textContent !== txt){
      el.mul.textContent = txt;
      el.mul.style.animation = "none"; void el.mul.offsetWidth; el.mul.style.animation = "";
    }
  }
}

/* ---------- 饺子皮操作 ---------- */
const skinMin = () => CONFIG.field.left + CONFIG.skin.width / 2 - 40;
const skinMax = () => CONFIG.field.right - CONFIG.skin.width / 2 + 40;

function setSkinTarget(px){ G.skinTarget = clamp(px, skinMin(), skinMax()); }

/* ---------- 左右键：按住不放就一直挪，松手就停 ----------
   这是本作唯一的操作方式。多点触摸也照顾到了：两边同时按 = 抵消不动，
   松开其中一个，饺子皮马上跟着另一个走（老人小孩容易两只手一起按）*/
const pressed = { "-1":false, "1":false };
function refreshMoveDir(){
  G.moveDir = (pressed["-1"] ? -1 : 0) + (pressed["1"] ? 1 : 0);
}
function bindMoveBtn(node, dir){
  const start = e => {
    if (e.cancelable) e.preventDefault();
    if (!G.running) return;
    pressed[dir] = true; refreshMoveDir();
    node.classList.add("down");
    hideHint();
  };
  const stop = () => { pressed[dir] = false; refreshMoveDir(); node.classList.remove("down"); };
  node.addEventListener("touchstart", start, {passive:false});
  node.addEventListener("touchend", stop);
  node.addEventListener("touchcancel", stop);
  node.addEventListener("mousedown", start);
  node.addEventListener("mouseup", stop);
  node.addEventListener("mouseleave", stop);
}
bindMoveBtn($("#mv-l"), -1);
bindMoveBtn($("#mv-r"), 1);

/* 键盘方向键：电脑上调试、以及万一机器带实体按键时能直接用 */
window.addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.key === "ArrowLeft"){ pressed["-1"] = true; refreshMoveDir(); hideHint(); }
  if (e.key === "ArrowRight"){ pressed["1"] = true; refreshMoveDir(); hideHint(); }
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft"){ pressed["-1"] = false; refreshMoveDir(); }
  if (e.key === "ArrowRight"){ pressed["1"] = false; refreshMoveDir(); }
});
/* 切走的时候把按键状态清掉，回来才不会自己一直往一边跑 */
window.addEventListener("blur", () => { pressed["-1"] = pressed["1"] = false; refreshMoveDir(); });

function hideHint(){
  el.hint.classList.add("gone");
  $("#mv-l").classList.remove("tip"); $("#mv-r").classList.remove("tip");
}

/* ---------- 主循环 ---------- */
function loop(ts){
  G.raf = requestAnimationFrame(loop);
  if (!G.lastTs) G.lastTs = ts;
  let dt = (ts - G.lastTs) / 1000;
  G.lastTs = ts;
  if (dt > 0.1) dt = 0.1;                 // 后台切回来别让东西瞬移

  if (!G.running) return;

  /* 时间 */
  G.t += dt;
  if (G.grace > 0) G.grace = Math.max(0, G.grace - dt);
  G.left = Math.max(0, CONFIG.duration - G.t);
  const leftStr = G.left <= 5 ? G.left.toFixed(1) : Math.ceil(G.left).toFixed(0);
  el.time.textContent = leftStr;
  el.time.classList.toggle("warn", G.left <= 5);
  el.timebar.style.width = (G.left / CONFIG.duration * 100).toFixed(2) + "%";
  el.timebar.classList.toggle("warn", G.left <= 5);
  if (G.left <= 0){ endGame(); return; }

  /* 饺子皮 */
  if (G.moveDir) setSkinTarget(G.skinTarget + G.moveDir * CONFIG.skin.btnSpeed * dt);
  G.skinX += (G.skinTarget - G.skinX) * (1 - Math.exp(-CONFIG.skin.follow * dt));
  G.skinX = clamp(G.skinX, skinMin(), skinMax());     // 兜底，别让皮跑出屏幕
  const tx = (G.skinX - CONFIG.skin.width / 2).toFixed(1);
  el.skin.style.setProperty("--tx", tx + "px");
  el.skin.style.transform = `translate(${tx}px,0)`;
  el.skinShadow.style.transform = `translate(${tx}px,0)`;

  /* 生成 */
  const p = curveT(), F = CONFIG.fall;
  G.nextSpawn -= dt;
  if (G.nextSpawn <= 0 && G.items.length < F.maxOnScreen && G.left > 0.9){
    spawn();
    const gap = (F.gapStart + (F.gapEnd - F.gapStart) * p) / CONFIG.difficulty;
    G.nextSpawn = gap * rnd(0.85, 1.15);
  }

  /* 下落 + 判定
     ⚠️ 这里绝对不能按下标 splice：接到食材会走到 completeDumpling，那里也会动 G.items，
     数组一变下标就错位，被误删的那个食材节点还留在 DOM 里、再没人更新它 —— 就是「食材悬在半空」。
     统一做法：只标 dead（removeItem 会摘掉节点），循环跑完再整体过滤一次。 */
  for (const it of G.items.slice()){
    if (it.dead) continue;
    const prevY = it.y;
    it.y += it.vy * dt;
    it.rot = Math.sin(it.y / 150 + it.phase) * it.swing;
    if (tryCatch(it, prevY)) continue;          // onCatch 里已经 removeItem 过了
    if (it.y > 1960){
      /* 该接没接上：不扣分，但断连击 */
      if (!it.gold && isNeeded(it.food) && G.combo > 0) { G.combo = 0; syncHud(); }
      removeItem(it); continue;
    }
    it.node.style.transform = `translate3d(${it.x}px,${it.y}px,0) rotate(${it.rot.toFixed(1)}deg)`;
  }
  if (G.items.some(it => it.dead)) G.items = G.items.filter(it => !it.dead);
}

/* ---------- 开局 / 结束 ---------- */
function resetGame(){
  G.items.forEach(it => removeItem(it));
  G.items = [];
  /* 兜底：按节点扫一遍掉落层，谁也别想跨局赖在屏幕上 */
  $$("#playfield .item, #playfield .float, #playfield .spark").forEach(n => n.remove());
  G.running = false; G.t = 0; G.left = CONFIG.duration;
  G.score = 0; G.combo = 0; G.maxCombo = 0; G.dumplings = 0; G.made = [];
  G.caught = 0; G.missed = 0; G.nextSpawn = 0.35; G.grace = 0;
  G.skinX = G.skinTarget = 540; G.moveDir = 0; G.lastTs = 0;
  pressed["-1"] = pressed["1"] = false;
  $("#mv-l").classList.remove("down"); $("#mv-r").classList.remove("down");
  G.target = null;
  nextTarget();
  syncHud();
  el.time.textContent = CONFIG.duration.toFixed(0);
  el.time.classList.remove("warn");
  el.timebar.style.width = "100%";
  el.timebar.classList.remove("warn");
  el.made.classList.remove("show");
  el.hint.classList.remove("gone");
  $("#mv-l").classList.add("tip"); $("#mv-r").classList.add("tip");   // 开局先闪一下，告诉玩家按这儿
  const tx = (G.skinX - CONFIG.skin.width / 2).toFixed(1);
  el.skin.style.transform = `translate(${tx}px,0)`;
  el.skinShadow.style.transform = `translate(${tx}px,0)`;
}

async function startGame(){
  Sound.init(); Sound.tap();
  clearIdle();
  show("s-game");
  buildMotes();
  resetGame();
  cancelAnimationFrame(G.raf);
  G.raf = requestAnimationFrame(loop);

  /* 3-2-1 */
  const cd = $("#countdown"), num = $("#cd-num");
  cd.classList.add("show");
  for (const n of ["3","2","1","开始!"]){
    num.textContent = n;
    num.style.animation = "none"; void num.offsetWidth; num.style.animation = "";
    Sound.drop();
    await sleep(n === "开始!" ? 450 : 700);
  }
  cd.classList.remove("show");

  G.lastTs = 0; G.running = true;
  Store.data.stats.plays++; Store.save();
  setTimeout(hideHint, 3500);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function endGame(){
  G.running = false;
  G.moveDir = 0; pressed["-1"] = pressed["1"] = false;
  $("#mv-l").classList.remove("down","tip"); $("#mv-r").classList.remove("down","tip");
  cancelAnimationFrame(G.raf); G.raf = 0;
  G.items.forEach(it => removeItem(it)); G.items = [];
  Store.data.stats.dumplings += G.dumplings; Store.save();
  Sound.win();
  setTimeout(showResult, 420);
}

/* ================================================================
 * 7. 结算 + 榜单
 * ================================================================ */
let myRecord = null;

function showResult(){
  const total = G.caught + G.missed;
  const acc = total ? Math.round(G.caught / total * 100) : 0;
  $("#res-dp").textContent = G.dumplings;
  $("#res-combo").textContent = G.maxCombo;
  $("#res-acc").textContent = acc + "%";
  $("#res-title").textContent = G.dumplings >= 4 ? "好手艺！" : (G.dumplings >= 2 ? "有模有样" : "再练练手");

  /* 把这局包出来的饺子摆出来，比干看数字有成就感。超过 6 只只摆 6 只 */
  const made = G.made.slice(0, 6);
  const w = made.length <= 3 ? 156 : (made.length === 4 ? 134 : 112);
  $("#res-made").innerHTML = made.length
    ? made.map((id, i) =>
        `<img src="${assetUrl(ASSETS.filling(id))}" style="width:${w}px;height:${Math.round(w*.8)}px;` +
        `animation-delay:${(i * .09 + .25).toFixed(2)}s" alt="">`).join("")
    : `<div class="none">这回一只都没包成，再来！</div>`;

  myRecord = { n: randomNick(), s: G.score, d: G.dumplings, c: G.maxCombo, a: acc, t: Date.now() };
  Store.add(myRecord);
  $("#name-in").value = myRecord.n;
  updateRankLine();

  show("s-result");
  countUp($("#res-score"), G.score, 900);
  startIdle();
}

/* 分数滚动：从 0 滚到最终分，先快后慢 */
function countUp(node, to, ms){
  const t0 = performance.now();
  (function tick(now){
    const k = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - k, 3);
    node.textContent = Math.round(to * e);
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}

function updateRankLine(){
  const rt = Store.rankOf(myRecord, "today");
  const node = $("#res-rank");
  node.className = "abs" + (rt <= 3 ? " m" + rt : "");
  node.textContent = rt === 1 ? "今日第 1 名！" : `今日第 ${rt} 名`;
}

function renameMe(name){
  if (!myRecord) return;
  const nm = (name || "").trim().slice(0, 6) || randomNick();
  const row = Store.data.board.find(r => r.t === myRecord.t);
  if (row) row.n = nm;
  myRecord.n = nm;
  Store.save();
}

let boardScope = "today";
function renderBoard(){
  const list = Store.list(boardScope).slice(0, 20);
  const box = $("#board-list");
  $("#board-empty").style.display = list.length ? "none" : "block";
  let html = list.map((r, i) => {
    const me = myRecord && r.t === myRecord.t;
    const mcls = i < 3 ? " m" + (i + 1) : "";
    return `<div class="row${me ? " me" : ""}">
      <div class="rk${mcls}">${i + 1}</div>
      <div class="nm">${escapeHtml(r.n)}</div>
      <div class="dp">${r.d} 只饺子</div>
      <div class="sc">${r.s}</div>
    </div>`;
  }).join("");
  /* 不足 10 条就补虚位，榜单始终是满的一版，看着像个正经榜 */
  for (let i = list.length; i < 10; i++){
    html += `<div class="row ph">
      <div class="rk">${i + 1}</div><div class="nm">虚位以待</div>
      <div class="dp">—</div><div class="sc">—</div></div>`;
  }
  box.innerHTML = html;
  if (myRecord){
    const idx = list.findIndex(r => r.t === myRecord.t);
    if (idx >= 0) setTimeout(() => {
      const node = box.children[idx];
      if (node) box.scrollTop = Math.max(0, node.offsetTop - 400);
    }, 30);
  }
}
const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));

$$("#tabs .tab").forEach(t => t.addEventListener("click", () => {
  Sound.tap();
  $$("#tabs .tab").forEach(x => x.classList.remove("on"));
  t.classList.add("on");
  boardScope = t.dataset.scope;
  renderBoard(); startIdle();
}));

function showBoard(){
  Sound.tap(); renderBoard(); show("s-board"); startIdle();
}

function backToAttract(){
  clearIdle();
  const b = Store.best();
  $("#best-line").innerHTML =
    `<img class="crown" src="${assetUrl('crown.png')}" alt=""><span>最高纪录</span> <b>${b ? b.s : 0}</b>`;
  show("s-attract");
}

/* 无操作自动回待机（售货机常年开着，别停在结算页） */
let idleTimer = 0;
function startIdle(){
  clearIdle();
  idleTimer = setTimeout(backToAttract, CONFIG.idleBackSec * 1000);
}
function clearIdle(){ if (idleTimer) { clearTimeout(idleTimer); idleTimer = 0; } }
["touchstart","mousedown"].forEach(ev => document.addEventListener(ev, () => {
  if (idleTimer) startIdle();
}, true));

/* ================================================================
 * 8. 按钮绑定
 * ================================================================ */
$("#btn-start").addEventListener("click", startGame);
$("#btn-board").addEventListener("click", showBoard);
$("#btn-board-play").addEventListener("click", startGame);
$("#btn-board-back").addEventListener("click", () => { Sound.tap(); backToAttract(); });
$("#btn-again").addEventListener("click", () => { renameMe($("#name-in").value); startGame(); });
$("#btn-toboard").addEventListener("click", () => { renameMe($("#name-in").value); showBoard(); });
$("#btn-reroll").addEventListener("click", () => {
  Sound.tap();
  const n = randomNick();
  $("#name-in").value = n;
  renameMe(n);
  startIdle();
});
$("#name-in").addEventListener("change", e => renameMe(e.target.value));
$("#name-in").addEventListener("blur", e => renameMe(e.target.value));

/* 声音按钮 */
function syncSndIcon(){
  const b = $("#snd");
  b.style.setProperty("--snd-icon", bgUrl(CONFIG.sound ? "icon-sound-on.png" : "icon-sound-off.png"));
  b.classList.toggle("off", !CONFIG.sound);
}
$("#snd").addEventListener("click", e => {
  e.stopPropagation();
  Store.setOver("sound", !CONFIG.sound);
  /* 关的时候直接把 BGM 停掉，不只是静音——不然页面还占着音频通道 */
  if (!CONFIG.sound && Sound.bgm) Sound.bgm.pause();
  Sound.init(); Sound.applyVolume(); syncSndIcon();
});
syncSndIcon();

/* ================================================================
 * 9. 运维面板：待机页左上角长按 3 秒
 * ================================================================ */
let holdTimer = 0;
const hot = $("#ops-hot");
const holdStart = () => { holdTimer = setTimeout(openAdmin, 3000); };
const holdEnd = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = 0; } };
hot.addEventListener("touchstart", holdStart, {passive:true});
hot.addEventListener("touchend", holdEnd);
hot.addEventListener("touchcancel", holdEnd);
hot.addEventListener("mousedown", holdStart);
hot.addEventListener("mouseup", holdEnd);
hot.addEventListener("mouseleave", holdEnd);

function openAdmin(){
  clearIdle();
  const b = Store.best();
  $("#ad-ver").textContent = VERSION;
  $("#ad-plays").textContent = Store.data.stats.plays;
  $("#ad-rows").textContent = Store.data.board.length;
  $("#ad-best").textContent = b ? `${b.s} 分（${b.n}）` : "—";
  $("#ad-sound").checked = CONFIG.sound;
  setRange("#ad-bgm", Math.round(CONFIG.bgmVolume * 100), "#ad-bgm-v", v => v + "%");
  setRange("#ad-sfx", Math.round(CONFIG.sfxVolume * 100), "#ad-sfx-v", v => v + "%");
  setRange("#ad-dur", CONFIG.duration, "#ad-dur-v", v => v + " 秒");
  setRange("#ad-diff", Math.round(CONFIG.difficulty * 100), "#ad-diff-v", v => (v/100).toFixed(2) + " 倍");
  setRange("#ad-idle", CONFIG.idleBackSec, "#ad-idle-v", v => v + " 秒");
  $("#admin").classList.add("show");
}
function setRange(sel, val, outSel, fmt){
  const r = $(sel); r.value = val; $(outSel).textContent = fmt(val);
}
function bindRange(sel, outSel, fmt, apply){
  const r = $(sel);
  r.addEventListener("input", () => { $(outSel).textContent = fmt(+r.value); apply(+r.value); });
}
bindRange("#ad-bgm", "#ad-bgm-v", v => v + "%", v => { Store.setOver("bgmVolume", v/100); Sound.applyVolume(); });
bindRange("#ad-sfx", "#ad-sfx-v", v => v + "%", v => { Store.setOver("sfxVolume", v/100); Sound.applyVolume(); });
bindRange("#ad-dur", "#ad-dur-v", v => v + " 秒", v => Store.setOver("duration", v));
bindRange("#ad-diff", "#ad-diff-v", v => (v/100).toFixed(2) + " 倍", v => Store.setOver("difficulty", v/100));
bindRange("#ad-idle", "#ad-idle-v", v => v + " 秒", v => Store.setOver("idleBackSec", v));
$("#ad-sound").addEventListener("change", e => { Store.setOver("sound", e.target.checked); Sound.applyVolume(); syncSndIcon(); });
$("#ad-clear-today").addEventListener("click", () => {
  if (!confirm("确定清空今日榜？")) return;
  const d = dayKey(Date.now());
  Store.data.board = Store.data.board.filter(r => dayKey(r.t) !== d);
  Store.save(); openAdmin();
});
$("#ad-clear-all").addEventListener("click", () => {
  if (!confirm("确定清空全部榜单？不可恢复")) return;
  Store.data.board = []; Store.save(); openAdmin();
});
$("#ad-export").addEventListener("click", () => {
  const txt = JSON.stringify(Store.data.board, null, 2);
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(
    () => alert("已复制 " + Store.data.board.length + " 条"),
    () => prompt("复制失败，手动复制：", txt));
  else prompt("手动复制：", txt);
});
$("#ad-close").addEventListener("click", () => { $("#admin").classList.remove("show"); backToAttract(); });
$("#ad-reload").addEventListener("click", () => location.reload());

/* ================================================================
 * 10. 起飞
 * ================================================================ */
(function boot(){
  /* 预热图片，别等到掉下来才加载 */
  const pre = [];
  Object.keys(FOODS).forEach(f => pre.push(ASSETS.item(f)));
  RECIPES.forEach(r => { pre.push(ASSETS.filling(r.id)); pre.push(ASSETS.flavor(r.id)); });
  pre.push(ASSETS.coin, "skin.png", "skin-shadow.png", "items/fx-sparkle.png",
           "bg-game.png", "bg-attract.png", "dumpling-glow.png");
  pre.forEach(f => { const i = new Image(); i.src = assetUrl(f); });

  backToAttract();
  /* 触摸屏首次交互才允许播声音 */
  const once = () => { Sound.init(); document.removeEventListener("touchstart", once); document.removeEventListener("mousedown", once); };
  document.addEventListener("touchstart", once);
  document.addEventListener("mousedown", once);
})();
</script>
